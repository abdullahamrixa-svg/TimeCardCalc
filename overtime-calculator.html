<!DOCTYPE html>
<html lang="en">
<head>
<meta name="monetag" content="1ac36c267d26c47a025244dcbdc2a4b3">
<script src="https://quge5.com/88/tag.min.js" data-zone="303037" async data-cfasync="false"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overtime Pay Calculator - Calculate Time and a Half, Double Time</title>
<meta name="description" content="Free Overtime Pay Calculator. Calculate regular pay, time and a half, double time pay. Best for US hourly workers.">
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:20px auto;padding:20px;background:#f5f7fa}
.card{background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h1{color:#1a73e8;text-align:center}
label{font-weight:bold;display:block;margin-top:15px}
input{width:100%;padding:12px;margin-top:5px;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:20px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:18px;cursor:pointer}
button:hover{background:#1557b0}
.result{background:#e8f0fe;padding:15px;border-radius:8px;margin-top:20px;font-size:18px}
a{color:#1a73e8;text-decoration:none}
.nav{text-align:center;margin-bottom:15px}
</style>
</head>
<body>
<div class="nav"><a href="/">← Back to Time Card Calculator</a></div>
<div class="card">
<h1>Overtime Pay Calculator</h1>
<p>Calculate your overtime, time and a half, and total paycheck.</p>

<label>Regular Hours Worked:</label>
<input type="number" id="regHours" placeholder="e.g. 40" value="40">

<label>Overtime Hours Worked:</label>
<input type="number" id="otHours" placeholder="e.g. 10" value="10">

<label>Hourly Rate ($):</label>
<input type="number" id="rate" placeholder="e.g. 20" value="20">

<label>Overtime Multiplier:</label>
<input type="number" id="multiplier" value="1.5" step="0.1">

<button onclick="calculate()">Calculate Overtime Pay</button>

<div class="result" id="result">Enter details to calculate</div>
</div>

<script>
function calculate(){
let rh=parseFloat(document.getElementById('regHours').value)||0;
let oh=parseFloat(document.getElementById('otHours').value)||0;
let rate=parseFloat(document.getElementById('rate').value)||0;
let mult=parseFloat(document.getElementById('multiplier').value)||1.5;
let regPay=rh*rate;
let otPay=oh*rate*mult;
let total=regPay+otPay;
document.getElementById('result').innerHTML=
`Regular Pay ( ${rh}h x $${rate} ) = <b>$${regPay.toFixed(2)}</b><br>
Overtime Pay ( ${oh}h x $${rate} x ${mult} ) = <b>$${otPay.toFixed(2)}</b><br><hr>
Total Pay = <b style="color:green; font-size:22px;">$${total.toFixed(2)}</b>`;
}
calculate();
</script>
</body>
</html>
